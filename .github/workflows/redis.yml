name: redis

on:
  push:
    branches: [main]
    paths:
      - "images/redis/**"
      - ".github/workflows/redis.yml"
  pull_request:
    paths:
      - "images/redis/**"
      - ".github/workflows/redis.yml"

concurrency:
  group: redis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version and tags
        id: version
        run: |
          source images/redis/current/debian-12/version.sh
          IMAGE="ghcr.io/${{ github.repository }}/redis"
          MAJOR_MINOR="${REDIS_APP_VERSION%.*}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${REDIS_VERSION}"
            echo "${IMAGE}:v${REDIS_APP_VERSION}"
            echo "${IMAGE}:v${MAJOR_MINOR}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: images/redis/current/debian-12
          platforms: linux/amd64
          load: true
          tags: redis-smoke-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name redis-smoke -e ALLOW_EMPTY_PASSWORD=yes redis-smoke-test:local
          for i in $(seq 1 30); do
            if docker exec redis-smoke redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis responded to ping"
              break
            fi
            sleep 1
          done
          docker exec redis-smoke redis-cli ping | grep -q PONG
          docker rm -f redis-smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/redis/current/debian-12
          provenance: false
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
